<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">GPX Terrain Studio 3D model viewer</title>
  <desc id="description">A visual preview of the GPX Terrain Studio workflow and an orange hexagonal terrain model with a raised route.</desc>
  <rect width="1440" height="900" fill="#17191b"/>
  <rect x="92" y="86" width="8" height="232" fill="#d86f3d"/>
  <text x="126" y="120" fill="#d86f3d" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="5">PRINTABLE TERRAIN</text>
  <text x="126" y="204" fill="#fffdf7" font-family="Georgia, serif" font-size="78" font-weight="700">GPX Terrain Studio</text>
  <text x="126" y="252" fill="#c4cec3" font-family="Georgia, serif" font-size="27">Turn a route into a watertight terrain model.</text>
  <line x1="92" y1="365" x2="1348" y2="365" stroke="#3b4641" stroke-width="2"/>
  <text x="92" y="403" fill="#a9b8ad" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">STEP 4 OF 4 · 3D MODEL VIEWER</text>
