    <text x="394" y="454" fill="#d86f3d">02</text><text x="394" y="483" fill="#d9e1d7">MAP &amp; TERRAIN AREA · READY</text>
    <text x="764" y="454" fill="#d86f3d">03</text><text x="764" y="483" fill="#d9e1d7">FINE-TUNE SETTINGS · READY</text>
    <text x="1114" y="454" fill="#d86f3d">04</text><text x="1114" y="483" fill="#fffdf7">3D MODEL VIEWER</text>
  </g>
  <rect x="92" y="514" width="1256" height="320" rx="4" fill="#edf2ea"/>
  <path d="M507 777 L395 697 L443 583 L599 546 L716 612 L715 730 L605 805 Z" fill="#d86f3d" stroke="#7f371e" stroke-width="10"/>
  <path d="M477 699 L503 636 L599 611 L667 644 L668 704 L600 750 L529 734 Z" fill="#f0a070" opacity=".92"/>
  <path d="M469 696 C515 673 526 725 565 693 S621 650 646 688" fill="none" stroke="#6d2d1c" stroke-width="17" stroke-linecap="round"/>
